name: NobleDNS scheduled build and release

on:
  schedule:
    # 02:23, 10:23 and 18:23 China Standard Time (UTC+8); cron uses UTC.
    - cron: '23 2,10,18 * * *'

  workflow_dispatch:
    inputs:
      allow_large_change:
        description: "Allow a large upstream/rule change after manual review"
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main

  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/**'
      - 'config/**'
      - 'data/**'
      - 'tests/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'docs/**'
      - 'update.py'
      - 'requirements*.txt'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'NobleDNS.txt'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - 'licenses/**'
      - 'dist/**'
      - '.gitattributes'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: nobledns-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      publish_update: ${{ steps.compare.outputs.publish_update }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check project license files
        shell: bash
        run: |
          set -euo pipefail

          test -s LICENSE
          test -s THIRD-PARTY-NOTICES.md
          test -s licenses/GPL-3.0.txt

          cmp -s LICENSE licenses/GPL-3.0.txt

          echo "Project license files exist and the GPL-3.0 copies match."

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate benchmark discovery and triage integrity
        run: python tools/validate_benchmark_discovery.py

      - name: Build from upstream sources with drift protection
        shell: bash
        env:
          ALLOW_LARGE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_change || false }}
        run: |
          set -euo pipefail

          EXTRA_ARGS=()

          if [ "$ALLOW_LARGE_CHANGE" = "true" ]; then
            EXTRA_ARGS+=(--allow-large-change)
            echo "Large change explicitly approved by workflow_dispatch input."
          if [ -f dist/manifest.json ]; then
            python update.py \
              --out build-output \
              --previous-manifest dist/manifest.json \
              "${EXTRA_ARGS[@]}"
          else
            python update.py \
              --out build-output \
              "${EXTRA_ARGS[@]}"
          fi

      - name: Audit active exception overlap against compiled rules
        run: |
          set -euo pipefail
          python tools/audit_exception_overlaps.py \
            --rules build-output/latest/dns-filter.txt \
            --output build-output/latest/exception-overlap-audit.csv

      - name: Audit bare-anchor rules against essential-service sentinels
        run: |
          set -euo pipefail
          python tools/audit_bare_anchor_safety.py \
            --rules build-output/latest/dns-filter.txt \
            --source build-output/latest/sources/adguard_dns.txt \
            --essential tests/fixtures/essential-domains.txt \
            --output build-output/latest/bare-anchor-audit.csv

      - name: Audit bare-anchor overlap against HTTP Archive discovery seed
        run: |
          set -euo pipefail
          python tools/audit_bare_anchor_discovery_overlap.py \
            --audit build-output/latest/bare-anchor-audit.csv \
            --discovery benchmark/discovery/http-archive-third-party-domains-2026-06.csv \
            --output build-output/latest/bare-anchor-discovery-overlap.csv

      - name: Validate bare-anchor review worksheet coverage
        run: |
          set -euo pipefail
          python tools/validate_bare_anchor_review_worksheet.py \
            --audit build-output/latest/bare-anchor-audit.csv \
            --worksheet benchmark/review/bare-anchor-review-worksheet.csv

      - name: Validate bare-anchor evidence queue integrity
        run: |
          set -euo pipefail
          python tools/validate_bare_anchor_evidence_queue.py \
            --audit build-output/latest/bare-anchor-audit.csv \
            --queue benchmark/discovery/bare-anchor-app-risk-triage.csv

      - name: Fetch immutable AdGuard Ukrainian filter evidence snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/AdguardTeam/AdguardBrowserExtension/69965fa59a5d5a44531768780850d3e788fa93e1/Extension/filters/edge/filter_23.txt" \
            --output /tmp/nobledns-adguard-filter-23.txt

      - name: Validate browser third-party scope-loss audit
        run: python tools/validate_browser_third_party_scope_audit.py --queue benchmark/discovery/bare-anchor-app-risk-triage.csv --audit benchmark/discovery/browser-third-party-scope-audit.csv --source /tmp/nobledns-adguard-filter-23.txt

      - name: Differential audit against mature DNS lists
        run: |
          set -euo pipefail
          python tools/comparator_differential.py \
            --nobledns build-output/latest/dns-filter.txt \
            --out-dir build-output/latest/comparators \
            --output build-output/latest/comparator-differential.json

      - name: Audit AdGuard Chinese filter for DNS-scope candidates (no production import)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_224_Chinese/filter.txt" \
            --output /tmp/nobledns-adguard-chinese-filter.txt
          python tools/audit_adguard_chinese.py \
            --source /tmp/nobledns-adguard-chinese-filter.txt \
            --current build-output/latest/dns-filter.txt \
            --csv build-output/latest/adguard-chinese-dns-candidates.csv \
            --json build-output/latest/adguard-chinese-dns-audit.json

      - name: Record build environment provenance
        shell: bash
        run: |
          set -euo pipefail

          OUT="build-output/latest"
          test -d "$OUT"

          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "python_version=$(python --version 2>&1)"
            echo
            echo "[installed_python_packages]"
            python -m pip freeze
          } > "$OUT/build-environment.txt"

      - name: Verify generated artifacts and manifest
        shell: bash
        run: |
          set -euo pipefail

          OUT="build-output/latest"

          test -s "$OUT/dns-filter.txt"
          test -s "$OUT/NobleDNS.txt"
          cmp -s "$OUT/dns-filter.txt" "$OUT/NobleDNS.txt"
          test -s "$OUT/manifest.json"
          test -s "$OUT/build-environment.txt"
          test -s "$OUT/validation-report.txt"
          test -s "$OUT/exception-overlap-audit.csv"
          test -s "$OUT/bare-anchor-audit.csv"
          test -s "$OUT/adguard-chinese-dns-audit.json"
          test -s "$OUT/adguard-chinese-dns-candidates.csv"
          test -s "$OUT/allowlist-active.txt"
          test -s "$OUT/parser-exclusions.csv"
          test -s "$OUT/LICENSE"
          test -s "$OUT/THIRD-PARTY-NOTICES.md"
          test -s "$OUT/licenses/GPL-3.0.txt"
          test -s "$OUT/sources/sources-manifest.json"

          cmp -s LICENSE "$OUT/LICENSE"
          cmp -s THIRD-PARTY-NOTICES.md "$OUT/THIRD-PARTY-NOTICES.md"
          cmp -s licenses/GPL-3.0.txt "$OUT/licenses/GPL-3.0.txt"

          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("build-output/latest/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert manifest.get("blocking_rules", 0) <= 500_000, \
              "Blocking rule count exceeds the project ceiling"

          assert len(manifest.get("sources", {})) == 4, \
              "Expected exactly four upstream sources"
          assert set(manifest.get("sources", {})) == {"adguard_dns", "hagezi_multi_pro", "hagezi_tif_mini", "awavenue_ads"}, \
              "Unexpected production source set"

          subscription = Path("build-output/latest/dns-filter.txt").read_text(encoding="utf-8")
          legacy = Path("build-output/latest/NobleDNS.txt").read_text(encoding="utf-8")
          assert subscription == legacy, "Legacy subscription differs from canonical list"
          assert f"! Version: {manifest['version']}" in subscription.splitlines(), "Header version differs from manifest"
          assert "! Expires: 8 hours" in subscription.splitlines(), "Filter expiry metadata missing"
          published_rules = [line for line in subscription.splitlines() if line and not line.startswith(("!", "#"))]
          assert not any(line.startswith(".") for line in published_rules), "Undocumented leading-dot rule found in public output"
          syntax_forms = manifest.get("syntax_audit", {}).get("forms", {})
          assert set(syntax_forms) == {"domain_and_subdomains", "domain_anchor_without_end_boundary", "domain_and_subdomains_wildcard", "domain_and_subdomains_important"}, "Unexpected public DNS syntax form"
          assert manifest.get("syntax_audit", {}).get("total") == manifest.get("blocking_rules"), "Syntax audit total differs from blocking rule count"
          assert manifest.get("active_exception_rules", 0) == len([line for line in subscription.splitlines() if line.startswith("@@")]), "Active exception count differs from manifest"
          assert manifest.get("main_subscription_rules") == manifest.get("blocking_rules", 0) + manifest.get("active_exception_rules", 0), "Main subscription rule counts are inconsistent"
          active_allowlist = Path("build-output/latest/allowlist-active.txt").read_text(encoding="utf-8").splitlines()
          active_rules = [line for line in active_allowlist if line and not line.startswith("!")]
          assert set(active_rules) == {line for line in subscription.splitlines() if line.startswith("@@")}, "Active allowlist artifact differs from subscription exceptions"

          licensing = manifest.get("licensing", {})
          original_code = licensing.get("original_project_code", {})
          upstream_data = licensing.get("upstream_rule_data", [])

          assert original_code.get("spdx") == "GPL-3.0-only", \
              "Unexpected original project code license metadata"

          assert isinstance(upstream_data, list) and len(upstream_data) == 4, \
              "Expected licensing metadata for exactly four upstream sources"

          print("Manifest source count, rule ceiling, and licensing metadata verified.")
          PY

      - name: Run quality regression gates against generated subscription
        env:
          NOBLEDNS_FILTER_PATH: build-output/latest/dns-filter.txt
        run: python -m unittest discover -s tests -p 'quality_gates.py' -v

      - name: Compare rules and source fingerprints
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          new = json.loads(
              Path("build-output/latest/manifest.json").read_text(encoding="utf-8")
          )

          old_path = Path("dist/manifest.json")
          old = (
              json.loads(old_path.read_text(encoding="utf-8"))
              if old_path.exists()
              else {}
          )

          new_hash = new["main_subscription_sha256"]
          new_file_hash = hashlib.sha256(
              Path("build-output/latest/dns-filter.txt").read_bytes()
          ).hexdigest()

          old_file_path = Path("dist/dns-filter.txt")
          old_file_hash = (
              hashlib.sha256(old_file_path.read_bytes()).hexdigest()
              if old_file_path.exists()
              else ""
          )

          audit_paths = ("syntax-audit.json", "syntax-review.csv", "exception-overlap-audit.csv", "bare-anchor-audit.csv", "adguard-chinese-dns-audit.json", "adguard-chinese-dns-candidates.csv")

          def normalized_audit_bytes(path):
              # Git normalizes text files to LF; compare semantic text, not checkout
              # newline/BOM representation, or every App-triggered rebuild can republish.
              return path.read_text(encoding="utf-8-sig").replace("\r\n", "\n").replace("\r", "\n").encode("utf-8")

          audit_changed = any(
              not (Path("dist") / name).exists()
              or hashlib.sha256(normalized_audit_bytes(Path("build-output/latest") / name)).hexdigest()
                 != hashlib.sha256(normalized_audit_bytes(Path("dist") / name)).hexdigest()
              for name in audit_paths
          )

          new_sources = {
              key: value["sha256"]
              for key, value in new["sources"].items()
          }

          expected_source_keys = {"adguard_dns", "hagezi_multi_pro", "hagezi_tif_mini", "awavenue_ads"}
          if set(new_sources) != expected_source_keys:
              raise ValueError("Build requires exactly the four approved source hashes")

          if len(new_hash) != 64 or any(len(value) != 64 for value in new_sources.values()):
              raise ValueError("Invalid SHA256 length in build manifest")

          old_sources = {
              key: value["sha256"]
              for key, value in old.get("sources", {}).items()
          }

          rules_changed = new_hash != old.get("main_subscription_sha256", "")
          sources_changed = new_sources != old_sources
          file_changed = new_file_hash != old_file_hash
          publish_update = rules_changed or sources_changed or file_changed or audit_changed

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as f:
              f.write(f"rules_changed={str(rules_changed).lower()}\n")
              f.write(f"sources_changed={str(sources_changed).lower()}\n")
              f.write(f"publish_update={str(publish_update).lower()}\n")
              f.write(f"file_changed={str(file_changed).lower()}\n")

          print(f"Rules changed: {rules_changed}")
          print(f"Sources changed: {sources_changed}")
          print(f"Subscription file changed: {file_changed}")
          print(f"Syntax audit changed: {audit_changed}")
          print(f"Publish update required: {publish_update}")
          print(f"New rule SHA256: {new_hash}")
          PY

      - name: Archive build and source audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nobledns-build-audit-${{ github.run_number }}
          path: build-output/latest/
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish validated subscription and versioned release
    needs: build-test

    # Pull requests, non-default branches and builds without substantive updates must never publish.
    # Publisher-App pushes trigger a follow-up main-branch validation run.
    # Once artifacts match the newly published manifest, that run will not republish.
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        github.ref == format(
          'refs/heads/{0}',
          github.event.repository.default_branch
        ) &&
        needs.build-test.outputs.publish_update == 'true'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # The default GITHUB_TOKEN is read-only. A repository-scoped GitHub App
    # installation token is minted only in this protected release environment.
    permissions:
      contents: read

    environment:
      name: release

    steps:
      - name: Create repository-scoped publisher token
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.NOBLEDNS_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.NOBLEDNS_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout exact build commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.publisher-token.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download validated build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nobledns-build-audit-${{ github.run_number }}
          path: build-output/latest

      - name: Verify public release channel
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL=$(python -c "import json; print(json.load(open('config/sources.json', encoding='utf-8'))['release_channel'])")

          if [ "$CHANNEL" != "public" ]; then
            echo "::error::Only the public release channel is permitted by this workflow."
            exit 1
          fi

          echo "Release channel: $CHANNEL"

      - name: Verify branch has not advanced since build
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"
          REMOTE_SHA="$(git rev-parse FETCH_HEAD)"

          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Default branch advanced after this build started."
            echo "Expected: $GITHUB_SHA"
            echo "Remote:   $REMOTE_SHA"
            echo "Aborting publication; the next run must rebuild from the new commit."
            exit 1
          fi

          echo "Build commit still matches the default branch."

      - name: Prepare public artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp build-output/latest/dns-filter.txt dist/dns-filter.txt
          cp build-output/latest/NobleDNS.txt NobleDNS.txt
          cp build-output/latest/manifest.json dist/manifest.json
          cp build-output/latest/validation-report.txt dist/validation-report.txt
          cp build-output/latest/exception-overlap-audit.csv dist/exception-overlap-audit.csv
          cp build-output/latest/bare-anchor-audit.csv dist/bare-anchor-audit.csv
          cp build-output/latest/adguard-chinese-dns-audit.json dist/adguard-chinese-dns-audit.json
          cp build-output/latest/adguard-chinese-dns-candidates.csv dist/adguard-chinese-dns-candidates.csv
          cp build-output/latest/allowlist-active.txt dist/allowlist-active.txt
          rm -f dist/whitelist-review.txt
          cp build-output/latest/parser-exclusions.csv dist/parser-exclusions.csv
          cp build-output/latest/syntax-audit.json dist/syntax-audit.json
          cp build-output/latest/syntax-review.csv dist/syntax-review.csv

      - name: Commit updated public artifacts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/ NobleDNS.txt

          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh NobleDNS artifacts $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No file-level changes to commit."
          fi

      - name: Verify branch still points to published commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"
          REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
          LOCAL_SHA="$(git rev-parse HEAD)"

          if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "::error::Remote branch no longer points to the validated publication commit."
            echo "Local:  $LOCAL_SHA"
            echo "Remote: $REMOTE_SHA"
            exit 1
          fi

          echo "Remote branch and publication commit match."

      - name: Verify all release assets
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/dns-filter.txt
          test -s NobleDNS.txt
          cmp -s dist/dns-filter.txt NobleDNS.txt
          test -s dist/manifest.json
          test -s dist/validation-report.txt
          test -s dist/exception-overlap-audit.csv
          test -s dist/adguard-chinese-dns-audit.json
          test -s dist/adguard-chinese-dns-candidates.csv
          test -s dist/allowlist-active.txt
          test -s dist/parser-exclusions.csv
          test -s dist/syntax-audit.json
          test -s dist/syntax-review.csv
          test -s LICENSE
          test -s THIRD-PARTY-NOTICES.md
          test -s licenses/GPL-3.0.txt

      # GitHub Releases are reserved for stable SemVer product-version snapshots.
      # Daily validated subscription updates are published to the main branch only.
      - name: Publish versioned SemVer release
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(python -c "import json; print(json.load(open('dist/manifest.json', encoding='utf-8'))['version'])")

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Manifest version is not stable SemVer: $VERSION"
            exit 1
          fi

          VERSION_TAG="v$VERSION"
          echo "Stable release tag: $VERSION_TAG"

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            IS_PRERELEASE="$(gh release view "$VERSION_TAG" --json isPrerelease --jq '.isPrerelease')"
            IS_DRAFT="$(gh release view "$VERSION_TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_PRERELEASE" = "true" ] || [ "$IS_DRAFT" = "true" ]; then
              echo "::error::The existing version release is a prerelease or draft; refusing to treat it as stable."
              exit 1
            fi

            echo "Stable version release already exists; leaving its tag and assets unchanged."
            echo "Daily subscription updates are published on main; this SemVer release remains unchanged by the publisher workflow."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION_TAG" >/dev/null 2>&1; then
            echo "::error::The version tag exists without a GitHub Release. Refusing to retarget it."
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/nobledns-release-notes.md"
          python tools/extract_release_notes.py \
            --changelog CHANGELOG.md \
            --version "$VERSION" \
            --output "$NOTES_FILE"

          gh release create "$VERSION_TAG" \
            dist/dns-filter.txt \
            NobleDNS.txt \
            dist/manifest.json \
            dist/validation-report.txt \
            dist/allowlist-active.txt \
            dist/parser-exclusions.csv \
            dist/syntax-audit.json \
            dist/syntax-review.csv \
            dist/exception-overlap-audit.csv \
            dist/bare-anchor-audit.csv \
            dist/adguard-chinese-dns-audit.json \
            dist/adguard-chinese-dns-candidates.csv \
            LICENSE \
            THIRD-PARTY-NOTICES.md \
            licenses/GPL-3.0.txt \
            --target "$(git rev-parse HEAD)" \
            --title "NobleDNS $VERSION" \
            --notes-file "$NOTES_FILE"
