name: NobleDNS repository hygiene

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repository-hygiene.yml'

  schedule:
    - cron: "17 4 * * 0"

  workflow_dispatch:
    inputs:
      execute:
        description: "Execute cleanup (otherwise perform a dry run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: nobledns-repository-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune closed-PR branches and legacy build releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Safely remove obsolete repository refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXECUTE: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.execute }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: $REPOSITORY"
          echo "Execution mode: $EXECUTE"

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"

          gh api --paginate "repos/$REPOSITORY/branches?per_page=100" \
            --jq '.[] | [.name, (.protected | tostring)] | @tsv' > branches.tsv

          gh api --paginate "repos/$REPOSITORY/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.REPOSITORY) | .head.ref' > closed-pr-branches.txt

          gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.REPOSITORY) | .head.ref' > open-pr-branches.txt

          branch_deleted=0
          branch_kept=0

          while IFS=$'\t' read -r branch protected; do
            [[ -n "$branch" ]] || continue
            if [[ "$branch" == "main" || "$protected" == "true" ]]; then
              echo "KEEP protected/default branch: $branch"
              continue
            fi

            remote_ref="refs/remotes/origin/$branch"
            git show-ref --verify --quiet "$remote_ref" || {
              echo "KEEP unavailable ref (cannot verify): $branch"
              branch_kept=$((branch_kept + 1))
              continue
            }

            safe_to_delete=false

            if grep -Fqx -- "$branch" open-pr-branches.txt; then
              echo "KEEP branch with an open pull request: $branch"
              branch_kept=$((branch_kept + 1))
              continue
            elif grep -Fqx -- "$branch" closed-pr-branches.txt; then
              safe_to_delete=true
              reason="associated pull request is closed and no open PR uses this branch"
            elif git merge-base --is-ancestor "$remote_ref" "$MAIN_SHA"; then
              safe_to_delete=true
              reason="branch tip is already contained in main history"
            fi

            if [[ "$safe_to_delete" != "true" ]]; then
              echo "KEEP unmerged or changed branch: $branch"
              branch_kept=$((branch_kept + 1))
              continue
            fi

            echo "DELETE inactive branch: $branch ($reason)"
            if [[ "$EXECUTE" == "true" ]]; then
              gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch"
            fi
            branch_deleted=$((branch_deleted + 1))
          done < branches.tsv

          gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' > releases.tsv

          release_deleted=0
          release_kept=0

          while IFS=$'\t' read -r release_id tag; do
            [[ -n "$tag" ]] || continue
            if [[ "$tag" =~ ^nobledns-[0-9a-f]{64}$ ]]; then
              echo "DELETE legacy content-addressed release: $tag"
              if [[ "$EXECUTE" == "true" ]]; then
                gh api --method DELETE "repos/$REPOSITORY/releases/$release_id"
                if gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1; then
                  echo "Deleted legacy tag: $tag"
                else
                  echo "WARNING: release deleted but tag deletion failed: $tag" >&2
                fi
              fi
              release_deleted=$((release_deleted + 1))
            else
              echo "KEEP formal/non-matching release: $tag"
              release_kept=$((release_kept + 1))
            fi
          done < releases.tsv

          echo "Summary:"
          echo "  Inactive branches eligible/deleted: $branch_deleted"
          echo "  Open-PR, unassociated, or unverifiable branches retained: $branch_kept"
          echo "  Legacy hash releases eligible/deleted: $release_deleted"
          echo "  Formal or non-matching releases retained: $release_kept"

          if [[ "$EXECUTE" != "true" ]]; then
            echo "Dry run only; no refs or releases were changed."
          fi
