name: NobleDNS upstream source audit

on:
  workflow_dispatch:
  push:
    branches:
      - "audit/**"
    paths:
      - "tools/upstream_audit.py"
      - ".github/workflows/upstream-source-audit.yml"
  pull_request:
    paths:
      - "tools/upstream_audit.py"
      - ".github/workflows/upstream-source-audit.yml"

permissions:
  contents: read

concurrency:
  group: nobledns-upstream-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Download and compare candidate sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check audit script syntax
        run: python -m py_compile tools/upstream_audit.py

      - name: Run isolated source audit
        run: python tools/upstream_audit.py --out audit-output

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nobledns-upstream-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
