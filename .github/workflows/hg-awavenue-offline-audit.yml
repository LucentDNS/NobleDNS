name: NobleDNS HG and AWAvenue offline audit

on:
  push:
    branches:
      - audit/hg-awavenue-offline-2026-11-12
    paths:
      - "tools/hg_awavenue_audit.py"
      - ".github/workflows/hg-awavenue-offline-audit.yml"
      - "update.py"
      - "tests/fixtures/essential-domains.txt"
      - "tests/fixtures/known-ads.txt"
  pull_request:
    branches:
      - main
    paths:
      - "tools/hg_awavenue_audit.py"
      - ".github/workflows/hg-awavenue-offline-audit.yml"
      - "update.py"
      - "tests/fixtures/essential-domains.txt"
      - "tests/fixtures/known-ads.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.ref == 'refs/heads/audit/hg-awavenue-offline-2026-11-12' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'audit/hg-awavenue-offline-2026-11-12' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Confirm audit-only workflow scope
        run: echo "This workflow only writes audit reports to the isolated audit branch."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned project dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate builder and audit script syntax
        run: |
          python -m py_compile update.py tools/hg_awavenue_audit.py
          python -m unittest discover -s tests -p "test_parser.py" -v

      - name: Pin baseline and upstream source commits
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          HG_MAIN_SHA="$(git ls-remote https://github.com/2771936993/HG.git refs/heads/main | awk '{print $1}')"
          AWAVENUE_MAIN_SHA="$(git ls-remote https://github.com/TG-Twilight/AWAvenue-Ads-Rule.git refs/heads/main | awk '{print $1}')"
          for name in BASELINE_MAIN_SHA HG_MAIN_SHA AWAVENUE_MAIN_SHA; do
            value="\${!name}"
            if ! [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve immutable commit for $name."
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Download snapshots and run offline comparison
        run: python tools/hg_awavenue_audit.py --out audit-output

      - name: Preserve exact source snapshots and machine-readable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nobledns-hg-awavenue-offline-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish audit reports to this isolated branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          TARGET="docs/audits/hg-awavenue-2026-11-12"
          mkdir -p "$TARGET"
          cp audit-output/reports/01-HG-source-audit.md "$TARGET/"
          cp audit-output/reports/02-AWAvenue-source-audit.md "$TARGET/"
          cp audit-output/reports/03-merged-increment-audit.md "$TARGET/"
          cp audit-output/audit.json "$TARGET/"
          cp audit-output/candidate-domain-inventory.csv "$TARGET/"
          cp audit-output/unsupported-source-lines.csv "$TARGET/"
          cp audit-output/effective-incremental-rules.csv "$TARGET/"
          cp audit-output/suspected-source-anomalies.csv "$TARGET/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "Audit reports are unchanged; no commit is needed."
            exit 0
          fi
          git commit -m "audit: publish HG and AWAvenue offline reports"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
