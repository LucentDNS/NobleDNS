name: NobleDNS HG and AWAvenue offline audit

on:
  push:
    branches:
      - audit/hg-awavenue-offline-2026-11-12
    paths:
      - "tools/hg_awavenue_audit.py"
      - ".github/workflows/hg-awavenue-offline-audit.yml"
      - "update.py"
      - "tests/fixtures/essential-domains.txt"
      - "tests/fixtures/known-ads.txt"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "tools/hg_awavenue_audit.py"
      - ".github/workflows/hg-awavenue-offline-audit.yml"
      - "update.py"
      - "tests/fixtures/essential-domains.txt"
      - "tests/fixtures/known-ads.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Read-only source auditing is separated from the push-only report publisher below.
concurrency:
  group: nobledns-hg-awavenue-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Run isolated offline audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false

      - name: Confirm audit-only workflow scope
        run: echo "This workflow only writes cached-parent offline audit reports to the isolated audit branch."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned project dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate builder and audit script syntax
        run: |
          python -m py_compile update.py tools/hg_awavenue_audit.py
          python -m unittest discover -s tests -p "test_parser.py" -v

      - name: Pin baseline and upstream source commits
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          HG_MAIN_SHA="$(git ls-remote https://github.com/2771936993/HG.git refs/heads/main | awk '{print $1}')"
          AWAVENUE_MAIN_SHA="$(git ls-remote https://github.com/TG-Twilight/AWAvenue-Ads-Rule.git refs/heads/main | awk '{print $1}')"
          for value in "$BASELINE_MAIN_SHA" "$HG_MAIN_SHA" "$AWAVENUE_MAIN_SHA"; do
            if ! [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve an immutable source commit."
              exit 1
            fi
          done
          printf 'BASELINE_MAIN_SHA=%s\nHG_MAIN_SHA=%s\nAWAVENUE_MAIN_SHA=%s\n' \
            "$BASELINE_MAIN_SHA" "$HG_MAIN_SHA" "$AWAVENUE_MAIN_SHA" >> "$GITHUB_ENV"

      - name: Download previously captured source snapshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nobledns-hg-awavenue-offline-audit
          run-id: 43184256306
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: audit-input

      - name: Run hash-verified offline source and merge audit
        run: python tools/hg_awavenue_audit.py --out audit-output --snapshot-dir audit-input/source-snapshots

      - name: Verify upstream refs remained stable during snapshot download
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASELINE_MAIN_SHA"
          test "$(git ls-remote https://github.com/2771936993/HG.git refs/heads/main | awk '{print $1}')" = "$HG_MAIN_SHA"
          test "$(git ls-remote https://github.com/TG-Twilight/AWAvenue-Ads-Rule.git refs/heads/main | awk '{print $1}')" = "$AWAVENUE_MAIN_SHA"

      - name: Preserve exact source snapshots and machine-readable reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nobledns-hg-awavenue-audit-results
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30

  publish-audit:
    name: Publish reports to isolated audit branch
    needs: audit
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/audit/hg-awavenue-offline-2026-11-12' &&
        needs.audit.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          ref: audit/hg-awavenue-offline-2026-11-12
          persist-credentials: true

      - name: Download audit reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nobledns-hg-awavenue-audit-results
          path: audit-output

      - name: Verify expected report files
        shell: bash
        run: |
          set -euo pipefail
          test -s audit-output/reports/01-HG-source-audit.md
          test -s audit-output/reports/02-AWAvenue-source-audit.md
          test -s audit-output/reports/03-merged-increment-audit.md
          test -s audit-output/audit.json
          test -s audit-output/candidate-domain-inventory.csv
          test -s audit-output/unsupported-source-lines.csv
          test -s audit-output/effective-incremental-rules.csv
          test -s audit-output/suspected-source-anomalies.csv

      - name: Publish audit reports to this isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          TARGET="docs/audits/hg-awavenue-2026-11-12"
          TARGET_BRANCH="audit/hg-awavenue-offline-2026-11-12"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reconcile concurrent audit runs safely. The generated audit-output
          # directory is untracked and survives branch checkout/reset.
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            mkdir -p "$TARGET"
            cp audit-output/reports/01-HG-source-audit.md "$TARGET/"
            cp audit-output/reports/02-AWAvenue-source-audit.md "$TARGET/"
            cp audit-output/reports/03-merged-increment-audit.md "$TARGET/"
            cp audit-output/audit.json "$TARGET/"
            cp audit-output/candidate-domain-inventory.csv "$TARGET/"
            cp audit-output/unsupported-source-lines.csv "$TARGET/"
            cp audit-output/effective-incremental-rules.csv "$TARGET/"
            cp audit-output/suspected-source-anomalies.csv "$TARGET/"
            git add "$TARGET"
            if git diff --cached --quiet; then
              echo "Audit reports are unchanged; no commit is needed."
              exit 0
            fi
            git commit -m "audit: publish HG and AWAvenue offline reports"
            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "::warning::Audit branch moved during push attempt ${attempt}; retrying against its latest tip."
          done
          echo "::error::Could not publish audit reports after three branch reconciliation attempts."
          exit 1
